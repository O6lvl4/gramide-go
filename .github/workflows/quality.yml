name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: almide/almide
          ref: 3e78b9b6000a3d668d7102b8c7ffa99efeef871f
          path: .ci/almide
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: compiler
        with:
          path: .ci/almide/target/release/almide
          key: almide-${{ runner.os }}-3e78b9b6000a3d668d7102b8c7ffa99efeef871f-rust1.97.0
      - if: steps.compiler.outputs.cache-hit != 'true'
        run: cargo build --release --locked --bin almide --manifest-path .ci/almide/Cargo.toml
      - name: Tests, build and CLI smoke
        env:
          ALMIDE_BIN: ${{ github.workspace }}/.ci/almide/target/release/almide
        run: bash ci/check.sh
